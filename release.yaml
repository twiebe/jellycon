version: '1:1.0.2-3'
changelog: |-
  Fork of JellyCon 1.0.2 (twiebe)
  -------------------------------
  + Show server errors to the user and let them resolve rejected logins
  + Don't keep Kodi from exiting: interruptible keepalive, faster service stop
  + Settings converted to settings format version 1
  + Short help text for every visible setting
  + Context menu works again when Kodi started before the user logged in
  + A user switch is picked up right away, without restarting Kodi
dependencies:
  py2:
    - addon: 'xbmc.python'
      version: '2.25.0'
    - addon: 'script.module.requests'
      version: '2.22.0'
    - addon: 'script.module.dateutil'
      version: '2.8.1'
    - addon: 'script.module.six'
      version: '1.13.0'
    - addon: 'script.module.kodi-six'
      version: '0.0.7'
    - addon: 'script.module.addon.signals'
      version: '0.0.5'
    - addon: 'script.module.futures'
      version: '2.2.0'
    - addon: 'script.module.websocket'
      version: '0.57.0'
  py3:
    - addon: 'xbmc.python'
      version: '3.0.0'
    - addon: 'script.module.requests'
      version: '2.22.0+matrix.1'
    - addon: 'script.module.dateutil'
      version: '2.8.1+matrix.1'
    - addon: 'script.module.six'
      version: '1.14.0+matrix.2'
    - addon: 'script.module.kodi-six'
